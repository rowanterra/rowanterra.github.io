# Build the site from content/ and publish public/ to the gh-pages branch.
# GitHub Pages serves gh-pages (Settings > Pages > Deploy from a branch > gh-pages, / root).
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/build_site.py
      - name: Check
        run: python3 tests/check_site.py
      - name: Publish public/ to gh-pages
        run: |
          cd public
          git init -q -b gh-pages
          git add -A
          git -c user.name="rowanterra" -c user.email="rowanterra@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
